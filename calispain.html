<script>

function ordine(prodotto, quantita, prezzo) {

    const conferma = confirm(
        "CONFERMA ORDINE\n\n" +
        "Prodotto: " + prodotto + "\n" +
        "Quantità: " + quantita + "\n" +
        "Prezzo: " + prezzo + "\n\n" +
        "Vuoi procedere?"
    );

    if (!conferma) {
        return;
    }

    const messaggio =
        "🛒 NUOVO ORDINE\n\n" +
        "📦 Prodotto: " + prodotto + "\n" +
        "⚖️ Quantità: " + quantita + "\n" +
        "💰 Prezzo: " + prezzo;

    const telegramURL =
        "https://t.me/Gasterpzzz?text=" +
        encodeURIComponent(messaggio);

    window.open(telegramURL, "_blank");

}

</script>
