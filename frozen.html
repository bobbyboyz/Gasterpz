<body>

<!-- SECONDA CASELLA -->

<div class="product-card">

<div class="image-box">

<button onclick="ordine('NOME PRODOTTO','500g','€')">

<button onclick="ordine('NOME PRODOTTO','1000g','€')">

</div>


</div>

<!-- ZOOM -->

<div id="imgPreview" class="img-preview" onclick="closeImage()">
    <img id="previewImg">
</div>


<script>

/* ORDINE */

function ordine(prodotto, quantita, prezzo) {

let conferma = confirm(
"Vuoi ordinare?\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo
);

if(conferma){

let messaggio =
"Nuovo ordine\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo;

window.open(
"https://t.me/Gasterpzzz?text=" + encodeURIComponent(messaggio),
"_blank"
);

}

}


/* FOTO */

const frozenPhotos = [
    "2026-05-26@10-21-31.jpeg",
    "IMG_0946.jpeg"
];

let frozenIndex = 0;

const frozenPhoto = document.getElementById("frozenPhoto");
const preview = document.getElementById("imgPreview");
const previewImg = document.getElementById("previewImg");


/* CAMBIO FOTO */

function cambiaFoto(direzione, event) {

event.stopPropagation();

frozenIndex += direzione;

if(frozenIndex < 0){
    frozenIndex = frozenPhotos.length - 1;
}

if(frozenIndex >= frozenPhotos.length){
    frozenIndex = 0;
}

frozenPhoto.src = frozenPhotos[frozenIndex];

}


/* ZOOM */

frozenPhoto.addEventListener("click", function(event) {

event.stopPropagation();

previewImg.src = this.src;
preview.style.display = "flex";

});


function closeImage() {

preview.style.display = "none";

}

</script>


<style>

/* FRECCE - SOLO GALLERIA PRODOTTO */

.product-gallery {
    position: relative;
}

.product-gallery .gallery-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 32px;
    border: none;
    border-radius: 7px;
    background: rgba(0,0,0,0.35);
    color: white;
    font-size: 22px;
    line-height: 28px;
    padding: 0;
    z-index: 5;
    cursor: pointer;
}

.product-gallery .gallery-arrow.left {
    left: 2px;
}

.product-gallery .gallery-arrow.right {
    right: 2px;
}

.product-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

</style>
