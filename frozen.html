<script>

function ordine(prodotto, quantita, prezzo) {

let conferma = confirm(
"Vuoi ordinare?\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo
);

if(conferma){

let messaggio =
"Nuovo ordine\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo;

window.open(
"https://t.me/Gasterpzzz?text=" + encodeURIComponent(messaggio),
"_blank"
);

}

}

</script>


<div id="imgPreview" class="img-preview" onclick="closeImage()">
    <img id="previewImg">
</div>


<script>

const preview = document.getElementById("imgPreview");
const previewImg = document.getElementById("previewImg");

document.querySelectorAll(".image-box img").forEach(img => {

    img.addEventListener("click", function () {

        previewImg.src = this.src;
        preview.style.display = "flex";

    });

});

function closeImage() {

    preview.style.display = "none";

}

</script>
