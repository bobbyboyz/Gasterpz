<body>

     src="2026-05-26@10-21-31.jpeg"

</button>

</div>

<div class="product-buttons">

<button onclick="ordine('LOONELY FARM FROZEN ⭐️','20g','€')">

<div class="product-buttons">

<button onclick="ordine('NOME PRODOTTO','20g','€')">
20g<br>€

<button onclick="ordine('NOME PRODOTTO','50g','€')">
50g<br>€
</button>

<button onclick="ordine('NOME PRODOTTO','100g','€')">
100g<br>€
</button>

<button onclick="ordine('NOME PRODOTTO','500g','€')">
500g<br>€
</button>

<button onclick="ordine('NOME PRODOTTO','1000g','€')">
1000g<br>€
</button>

</div>

</div>


</div>

<script>

/* ORDINI */

function ordine(prodotto, quantita, prezzo) {

let conferma = confirm(
"Vuoi ordinare?\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo
);

if(conferma){

let messaggio =
"Nuovo ordine\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo;

window.open(
"https://t.me/Gasterpzzz?text=" + encodeURIComponent(messaggio),
"_blank"
);

}

}


/* FOTO FROZEN */

const frozenPhotos = [
    "2026-05-26@10-21-31.jpeg",
    "IMG_0946.jpeg"
];

let frozenIndex = 0;

function cambiaFoto(direzione, event) {

event.stopPropagation();

frozenIndex += direzione;

if(frozenIndex < 0){
    frozenIndex = frozenPhotos.length - 1;
}

if(frozenIndex >= frozenPhotos.length){
    frozenIndex = 0;
}

document.getElementById("frozenPhoto").src =
    frozenPhotos[frozenIndex];

}


/* ZOOM FOTO */

const preview = document.getElementById("imgPreview");
const previewImg = document.getElementById("previewImg");

</script>


<div id="imgPreview" class="img-preview" onclick="closeImage()">
    <img id="previewImg">
</div>


<script>

document.getElementById("frozenPhoto").addEventListener("click", function () {

    previewImg.src = this.src;
    preview.style.display = "flex";

});


function closeImage() {

    preview.style.display = "none";

}

</script>


<style>

/* SOLO LE FRECCE DELLA GALLERIA FROZEN */

.product-gallery {
    position: relative;
}

.product-gallery .gallery-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 45px;
    border: none;
    border-radius: 10px;
    background: rgba(0,0,0,0.45);
    color: white;
    font-size: 30px;
    line-height: 40px;
    padding: 0;
    z-index: 5;
    cursor: pointer;
}

.product-gallery .gallery-arrow.left {
    left: 5px;
}

.product-gallery .gallery-arrow.right {
    right: 5px;
}

.product-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

</style>
