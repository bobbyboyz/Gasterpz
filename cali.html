<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALI - Gasterpz</title>

<link rel="stylesheet" href="style.css">

<style>

.product-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:10px;
}


.product-card {
background:#ffffff;
border-radius:15px;
height:260px;
padding:10px;
box-sizing:border-box;
display:flex;
flex-direction:column;
justify-content:space-between;
text-align:center;
}


.image-box {
height:100px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
}


.product-name {
font-size:14px;
font-weight:bold;
}


.product-buttons {
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:5px;
}


.product-buttons button {
font-size:10px;
padding:5px;
}

</style>

</head>

<body>

<div class="home">


<h1>CALI</h1>


<div class="product-grid">


<div class="product-card">


<div class="image-box">
FOTO
</div>


<div class="product-name">
NOME ERBA
</div>


<div class="product-buttons">

<button>20g<br>€</button>
<button>50g<br>€</button>
<button>100g<br>€</button>
<button>500g<br>€</button>
<button>1000g<br>€</button>

</div>


</div>

<button>20g<br>€</button>

<button>100g<br>€</button>
<button>500g<br>€</button>
<button>1000g<br>€</button>

</div>


</div>


</div>


</div>


</body>

</html>
