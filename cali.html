<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALI - Gasterpz</title>

<link rel="stylesheet" href="style.css">


<style>

.product-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:10px;
}


.product-card {

background:white;
border:2px solid #e5e5e5;
border-radius:25px;
height:150px;
padding:10px;
box-sizing:border-box;

display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;

}


.image-box {

width:45px;
height:45px;

border:2px solid #e5e5e5;
border-radius:12px;

display:flex;
align-items:center;
justify-content:center;

font-size:8px;

}


.product-name {

font-size:12px;
font-weight:bold;

}


.product-buttons {

display:flex;
flex-wrap:wrap;
justify-content:center;
gap:3px;

}


.product-buttons button {

font-size:9px;
padding:3px 5px;
border-radius:8px;

}


</style>


</head>


<body>


<div class="home">


<h1>CALI</h1>


<div class="product-grid">



<div class="product-card">


<div class="image-box">
FOTO
</div>


<div class="product-name">
NOME ERBA
</div>


<div class="product-buttons">


<button onclick="ordine('NOME ERBA','20g','€')">
20g<br>€
</button>

<button onclick="ordine('NOME ERBA','50g','€')">
50g<br>€
</button>

<button onclick="ordine('NOME ERBA','100g','€')">
100g<br>€
</button>

<button onclick="ordine('NOME ERBA','500g','€')">
500g<br>€
</button>

<button onclick="ordine('NOME ERBA','1000g','€')">
1000g<br>€
</button>


</div>


</div>




<div class="product-card">


<div class="image-box">

</div>


<div class="product-name">
NOME ERBA
</div>


<div class="product-buttons">


<button onclick="ordine('NOME ERBA','20g','€')">
20g<br>€
</button>

<button onclick="ordine('NOME ERBA','50g','€')">
50g<br>€
</button>

<button onclick="ordine('NOME ERBA','100g','€')">
100g<br>€
</button>

<button onclick="ordine('NOME ERBA','500g','€')">
500g<br>€
</button>

<button onclick="ordine('NOME ERBA','1000g','€')">
1000g<br>€
</button>


</div>


</div>



</div>


</div>




<script>


function ordine(prodotto, quantita, prezzo) {


let conferma = confirm(
"Vuoi ordinare?\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo
);


if(conferma){


let messaggio =
"Nuovo ordine\n\n" +
"Prodotto: " + prodotto +
"\nQuantità: " + quantita +
"\nPrezzo: " + prezzo;


window.open(
"https://t.me/Gasterpzzz?text=" + encodeURIComponent(messaggio),
"_blank"
);


}


}


</script>


</body>

</html>
