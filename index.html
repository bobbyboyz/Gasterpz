<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gasterpz</title>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:
linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
url("IMG_0919.png");
background-size:cover;
background-position:center;
background-attachment:fixed;
}


.hero{
padding:20px;
}


.logo-card{
background:white;
border-radius:20px;
padding:15px;
}


.logo{
width:100%;
height:300px;
object-fit:cover;
border-radius:15px;
display:block;
}


.container{
padding:15px;
}


.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}


.card{
background:white;
border-radius:15px;
padding:10px;
text-align:center;
}


.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
}


button{
background:#000;
color:white;
border:0;
padding:12px;
border-radius:10px;
width:100%;
margin-top:8px;
}


.box{
display:none;
position:fixed;
left:5%;
top:15%;
width:90%;
background:white;
padding:20px;
border-radius:20px;
}


.cart{
margin-top:20px;
background:white;
padding:15px;
border-radius:15px;
}


</style>

</head>


<body>


<div class="hero">

<div class="logo-card">

<img class="logo" src="IMG_0919.png">

</div>

</div>



<div class="container">


<div class="products">


<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 1</h3>
<button onclick="openBox('Prodotto 1')">Apri</button>
</div>


<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 2</h3>
<button onclick="openBox('Prodotto 2')">Apri</button>
</div>


<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 3</h3>
<button onclick="openBox('Prodotto 3')">Apri</button>
</div>


<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 4</h3>
<button onclick="openBox('Prodotto 4')">Apri</button>
</div>


<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 5</h3>
<button onclick="openBox('Prodotto 5')">Apri</button>
</div>


</div>



<div class="cart">

<h2>🛒 Carrello</h2>

<p id="cart">Vuoto</p>

<button onclick="order()">
ORDINA
</button>

</div>


</div>





<div class="box" id="box">

<h2 id="nome"></h2>

<p>Scegli quantità:</p>

<button onclick="addCart('100g - Prezzo')">
100g - Prezzo
</button>

<button onclick="addCart('200g - Prezzo')">
200g - Prezzo
</button>

<button onclick="addCart('500g - Prezzo')">
500g - Prezzo
</button>

<button onclick="addCart('1kg - Prezzo')">
1kg - Prezzo
</button>

<button onclick="closeBox()">
Chiudi
</button>


</div>





<script>

let prodotto="";
let lista=[];


function openBox(nome){

prodotto=nome;

document.getElementById("nome").innerHTML=nome;

document.getElementById("box").style.display="block";

}



function closeBox(){

document.getElementById("box").style.display="none";

}



function addCart(opzione){

lista.push(prodotto+" - "+opzione);

document.getElementById("cart").innerHTML=lista.join("<br>");

closeBox();

}



function order(){

let messaggio="Ciao, vorrei ordinare:\n\n"+lista.join("\n");


window.open(
"https://t.me/Gasterpzzz?text="+encodeURIComponent(messaggio)
);


}


</script>


</body>
</html>
