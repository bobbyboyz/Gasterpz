<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GasTerpz</title>

<style>

body{
    margin:0;
    padding:0;
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
}

.container{
    padding:30px 20px;
}

.logo{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 30px #ffb300;
    margin-top:20px;
}

h1{
    color:#ffb300;
    font-size:42px;
    letter-spacing:4px;
    margin:20px 0 10px;
}

p{
    color:#ddd;
    font-size:18px;
    margin-bottom:35px;
}

.btn{
    display:block;
    width:100%;
    max-width:320px;
    margin:15px auto;
    padding:18px;
    background:#ffb300;
    color:#111;
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

.info{
    display:none;
    max-width:320px;
    margin:20px auto;
    padding:20px;
    background:#222;
    border-radius:15px;
    color:white;
    line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<img src="IMG_0919.png" class="logo">

<h1>GASTERPZ</h1>

<p>🔥 Apri la Mini App per scoprire il catalogo sempre aggiornato.</p>

<a class="btn" href="https://bobbyboyz.github.io/Gasterpz/">
📱 Apri Mini App
</a>

<button class="btn" onclick="toggleInfo()">
ℹ️ Informazioni
</button>

<div class="info" id="info">

<h2>GasTerpz 🔥</h2>

<p>
Benvenuto nella Mini App ufficiale.<br><br>

Qui puoi consultare il catalogo aggiornato, visualizzare le novità e rimanere sempre aggiornato.
</p>

</div>

</div>

<script>

function toggleInfo(){

const info=document.getElementById("info");

if(info.style.display==="block"){
    info.style.display="none";
}else{
    info.style.display="block";
}

}

</script>

</body>
</html>
