<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GasTerpz</title>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
background:#000;
color:white;
}


.hero{
text-align:center;
}


.logo{
width:90%;
height:250px;
object-fit:cover;
border-radius:20px;
margin:15px;
}


.container{
padding:15px;
}


.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}


.card{
background:#111;
border-radius:15px;
padding:10px;
text-align:center;
border:1px solid #333;
}


.card img{
width:100%;
height:130px;
object-fit:cover;
border-radius:10px;
}


button{

background:white;
color:black;
border:0;
padding:12px;
border-radius:10px;
width:100%;
margin-top:10px;
font-weight:bold;

}


.box{

display:none;
position:fixed;
left:5%;
top:15%;
width:90%;
background:#111;
padding:20px;
border-radius:20px;
border:1px solid #444;

}


.cart{

background:#111;
padding:15px;
margin-top:20px;
border-radius:15px;

}


</style>

</head>


<body>


<div class="hero">

<img class="logo" src="IMG_0919.png">

</div>



<div class="container">


<div class="products">


<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Weed 🌿</h3>
<button onclick="openBox('Weed 🌿')">Apri</button>
</div>



<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Frozen/Static ⚡️🧊</h3>
<button onclick="openBox('Frozen/Static ⚡️🧊')">Apri</button>
</div>



<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Estrazioni 🍯</h3>
<button onclick="openBox('Estrazioni 🍯')">Apri</button>
</div>



<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Dry Work 🍫</h3>
<button onclick="openBox('Dry Work 🍫')">Apri</button>
</div>



<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Vape Pen 💨</h3>
<button onclick="openBox('Vape Pen 💨')">Apri</button>
</div>


</div>



<div class="cart">

<h2>🛒 Carrello</h2>

<p id="cart">Vuoto</p>

</div>


</div>




<div class="box" id="box">


<h2 id="nome"></h2>


<button onclick="addCart('100g')">
100g
</button>


<button onclick="addCart('200g')">
200g
</button>


<button onclick="addCart('500g')">
500g
</button>


<button onclick="addCart('1kg')">
1kg
</button>


<button onclick="closeBox()">
Chiudi
</button>


</div>



<script>


let prodotto="";
let lista=[];



function openBox(nome){

prodotto=nome;

document.getElementById("nome").innerHTML=nome;

document.getElementById("box").style.display="block";

}



function closeBox(){

document.getElementById("box").style.display="none";

}



function addCart(opzione){

lista.push(prodotto+" - "+opzione);


document.getElementById("cart").innerHTML=
lista.join("<br>");


closeBox();

}


</script>


</body>
</html>
