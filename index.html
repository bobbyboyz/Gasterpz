<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasterpz</title>

<style>
body {
  font-family: Arial;
  background:#f2f2f2;
  margin:0;
  padding:15px;
}

.logo {
  width:150px;
  height:150px;
  background:#111;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:30px;
  font-weight:bold;
}

h1 {
  text-align:center;
  letter-spacing:3px;
}

.products {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product {
  background:white;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

.product img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:8px;
}

button {
  background:#111;
  color:white;
  border:0;
  padding:10px;
  border-radius:8px;
  width:100%;
}

#popup {
  display:none;
  position:fixed;
  top:20%;
  left:10%;
  width:80%;
  background:white;
  padding:20px;
  border-radius:15px;
}

.cart {
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:12px;
}
</style>

</head>

<body>

<div <img class="logo-img" srcIMG_0919.png

<h1>GASTERPZ</h1>


<div class="products">

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 1</h3>
<button onclick="openProduct('Prodotto 1')">Apri</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 2</h3>
<button onclick="openProduct('Prodotto 2')">Apri</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 3</h3>
<button onclick="openProduct('Prodotto 3')">Apri</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 4</h3>
<button onclick="openProduct('Prodotto 4')">Apri</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Prodotto 5</h3>
<button onclick="openProduct('Prodotto 5')">Apri</button>
</div>

</div>


<div id="popup">
<h2 id="name"></h2>

<p>Scegli quantità:</p>

<button onclick="addCart(1,10)">1 pezzo - 10€</button>
<br><br>
<button onclick="addCart(5,40)">5 pezzi - 40€</button>
<br><br>
<button onclick="addCart(10,70)">10 pezzi - 70€</button>

<br><br>
<button onclick="closeBox()">Chiudi</button>

</div>


<div class="cart">
<h2>🛒 Carrello</h2>
<p id="cart">Vuoto</p>
</div>


<script>

let prodotto="";
let carrello=[];

function openProduct(nome){
prodotto=nome;
document.getElementById("name").innerHTML=nome;
document.getElementById("popup").style.display="block";
}

function closeBox(){
document.getElementById("popup").style.display="none";
}

function addCart(q,p){
carrello.push(prodotto+" x"+q+" = "+p+"€");
document.getElementById("cart").innerHTML=carrello.join("<br>");
closeBox();
}

</script>

</body>
</html>
