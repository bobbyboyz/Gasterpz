<head>

<body>

<button class="back-button" onclick="history.back()">
    ← Indietro
</button>

<div class="home" style="padding-top:55px;">

    <

    <div class="product-grid">

        <!-- PRODOTTO 1 -->
        <div class="product-card">

            <div class="image-box">
                <img src="FOTO" alt="DRY">
            </div>

            <div class="product-name">
                NOME PRODOTTO
            </div>

            <div class="product-buttons">

                <button onclick="ordine('NOME PRODOTTO', '20g', '€')">
                    20g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO', '50g', '€')">
                    50g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO', '100g', '€')">
                    100g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO', '500g', '€')">
                    500g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO', '1000g', '€')">
                    1000g<br>€
                </button>

            </div>

        </div>


        <!-- PRODOTTO 2 -->
        <div class="product-card">

            <div class="image-box">
                <img src="FOTO" alt="DRY 2">
            </div>

            <div class="product-name">
                NOME PRODOTTO 2
            </div>

            <div class="product-buttons">

                <button onclick="ordine('NOME PRODOTTO 2', '20g', '€')">
                    20g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO 2', '50g', '€')">
                    50g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO 2', '100g', '€')">
                    100g<br>€
                </button>

                <button onclick="ordine('NOME PRODOTTO 2', '500g', '€')">

                <button onclick="ordine('NOME PRODOTTO 2', '1000g', '€')">
                    1000g<br>€
                </button>

            </div>

        </div>

    </div>

</div>


<script>

function ordine(prodotto, quantita, prezzo) {

    const conferma = confirm(
        "CONFERMA ORDINE\n\n" +
        "Prodotto: " + prodotto + "\n" +
        "Quantità: " + quantita + "\n" +
        "Prezzo: " + prezzo + "\n\n" +
        "Vuoi procedere?"
    );

    if (!conferma) {
        return;
    }

    const messaggio =
        "🛒 NUOVO ORDINE\n\n" +
        "📦 Prodotto: " + prodotto + "\n" +
        "⚖️ Quantità: " + quantita + "\n" +
        "💰 Prezzo: " + prezzo;

    const telegramURL =
        "https://t.me/Gasterpzzz?text=" +
        encodeURIComponent(messaggio);

    window.open(telegramURL, "_blank");

}

</script>

</body>
